{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro de Usuario</title>
  <style>
    :root{ --bg:#050814; --card-bg: rgba(255,255,255,0.04); }
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{background:linear-gradient(180deg,#020412 0%, #071026 60%); color:#eaf6ff; overflow:hidden}
    .login-form {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 80;
      background: var(--card-bg);
      padding: 30px; border-radius: 14px;
      box-shadow: 0 8px 40px rgba(2,8,23,0.8);
      width: 320px;
    }
    .login-form h2 { text-align: center; margin-top: 0; }
    .login-form .input-group { margin-bottom: 15px; }
    .login-form label { display: block; margin-bottom: 5px; font-size: 0.9rem; opacity: 0.8; }
    .login-form input { width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box; }
    .btn {
        background: linear-gradient(90deg,#78ffd6,#59d0ff);
        border: none;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        padding: 12px;
        margin-top: 10px;
    }
    .sub-text { text-align: center; font-size: 0.8rem; margin-top: 15px; }
    .sub-text a { color: #78ffd6; text-decoration: none; }
    .error-banner{position:absolute;left:50%;top:20px;transform:translateX(-50%);z-index:1000;background:rgba(255,60,60,0.12);border:1px solid rgba(255,60,60,0.2);color:#fff;padding:8px 12px;border-radius:8px;backdrop-filter: blur(4px);display:none}
  </style>
</head>
<body>
  {% csrf_token %}
  <div id="errorBanner" class="error-banner" role="alert"></div>
  <form id="registerForm" class="login-form">
    <h2>Registro</h2>
    <div class="input-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="input-group">
        <label for="role">Rol</label>
        <select id="role" name="role" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box;">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>
    </div>
    <button type="submit" class="btn">Registrarse</button>
    <p class="sub-text"><a href="/">¿Ya tienes cuenta? Inicia sesión</a></p>
  </form>

  <script>
    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = registerForm.querySelector('#username').value;
      const password = registerForm.querySelector('#password').value;
      const role = registerForm.querySelector('#role').value;

      try {
        const csrfToken = getCookie('csrftoken');
        console.log('CSRF Token:', csrfToken);
        console.log('Sending data:', { username, password, role });

        const response = await fetch('/api/register/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken || '',
          },
          body: JSON.stringify({ username, password, role }),
        });

        console.log('Response status:', response.status);
        console.log('Response ok:', response.ok);

        if (response.ok) {
          const data = await response.json();
          console.log('Success data:', data);
          // Redirect to the URL provided by the server
          if (data.redirect_url) {
            console.log('Redirecting to:', data.redirect_url);
            window.location.href = data.redirect_url;
          } else {
            // Fallback redirect
            console.log('Fallback redirect');
            window.location.href = 'http://localhost:3000/page';
          }
        } else {
          const errorData = await response.json();
          console.log('Error data:', errorData);
          const errorBanner = document.getElementById('errorBanner');
          let errorMessage = 'Registration failed: ';
          for (const key in errorData) {
              errorMessage += `${key}: ${errorData[key].join(', ')} `;
          }
          errorBanner.textContent = errorMessage;
          errorBanner.style.display = 'block';
        }
      } catch (error) {
        console.error('Fetch error:', error);
        const errorBanner = document.getElementById('errorBanner');
        errorBanner.textContent = 'Network error: ' + error.message;
        errorBanner.style.display = 'block';
      }
    });

    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
  </script>
</body>
</html>
