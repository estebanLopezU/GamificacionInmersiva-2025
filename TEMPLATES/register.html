{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro de Usuario</title>
  <style>
    :root{ --bg:#050814; --card-bg: rgba(255,255,255,0.04); }
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{background:linear-gradient(180deg,#020412 0%, #071026 60%); color:#eaf6ff; overflow:hidden}
    .login-form {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 80;
      background: var(--card-bg);
      padding: 30px; border-radius: 14px;
      box-shadow: 0 8px 40px rgba(2,8,23,0.8);
      width: 320px;
    }
    .login-form h2 { text-align: center; margin-top: 0; }
    .login-form .input-group { margin-bottom: 15px; }
    .login-form label { display: block; margin-bottom: 5px; font-size: 0.9rem; opacity: 0.8; }
    .login-form input { width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box; }
    .btn {
        background: linear-gradient(90deg,#78ffd6,#59d0ff);
        border: none;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        padding: 12px;
        margin-top: 10px;
    }
    .sub-text { text-align: center; font-size: 0.8rem; margin-top: 15px; }
    .sub-text a { color: #78ffd6; text-decoration: none; }
    .error-banner{position:absolute;left:50%;top:20px;transform:translateX(-50%);z-index:1000;background:rgba(255,60,60,0.12);border:1px solid rgba(255,60,60,0.2);color:#fff;padding:8px 12px;border-radius:8px;backdrop-filter: blur(4px);display:none}
  </style>
</head>
<body>
  {% csrf_token %}
  <div id="errorBanner" class="error-banner" role="alert"></div>
  <form id="registerForm" class="login-form">
    <h2>Registro</h2>
    <div class="input-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div class="input-group">
      <label for="email">Correo UNAL (@unal.edu.co)</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="input-group">
        <label for="role">Rol</label>
        <select id="role" name="role" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box;">
            <option value="user">Usuario</option>
            <option value="admin">Administrador</option>
        </select>
    </div>
    <div class="input-group">
        <label for="user_type">Tipo de Usuario</label>
        <select id="user_type" name="user_type" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box;" required>
            <option value="">Seleccionar...</option>
            <option value="student">Estudiante</option>
            <option value="professor">Profesor</option>
        </select>
    </div>
    <div class="input-group">
      <label for="display_name">Nombre Completo</label>
      <input type="text" id="display_name" name="display_name">
    </div>

    <!-- Student fields -->
    <div id="student_fields" style="display: none;">
      <div class="input-group">
        <label for="career">Carrera</label>
        <input type="text" id="career" name="career">
      </div>
      <div class="input-group">
        <label for="semester">Semestre</label>
        <input type="number" id="semester" name="semester" min="1" max="20">
      </div>
      <div class="input-group">
        <label for="academic_program">Programa Académico</label>
        <input type="text" id="academic_program" name="academic_program">
      </div>
    </div>

    <!-- Professor fields -->
    <div id="professor_fields" style="display: none;">
      <div class="input-group">
        <label for="job_title">Cargo</label>
        <input type="text" id="job_title" name="job_title">
      </div>
      <div class="input-group">
        <label for="is_permanent">Tipo de Contratación</label>
        <select id="is_permanent" name="is_permanent" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box;">
            <option value="">Seleccionar...</option>
            <option value="true">Profesor de Planta</option>
            <option value="false">Profesor Ocasional</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn">Registrarse</button>
    <p class="sub-text"><a href="/">¿Ya tienes cuenta? Inicia sesión</a></p>
  </form>

  <script>
    // Handle user type change to show/hide fields
    const userTypeSelect = document.getElementById('user_type');
    const studentFields = document.getElementById('student_fields');
    const professorFields = document.getElementById('professor_fields');

    userTypeSelect.addEventListener('change', function() {
      const userType = this.value;
      if (userType === 'student') {
        studentFields.style.display = 'block';
        professorFields.style.display = 'none';
        // Make student fields required
        document.getElementById('career').required = true;
        document.getElementById('semester').required = true;
        document.getElementById('job_title').required = false;
        document.getElementById('is_permanent').required = false;
      } else if (userType === 'professor') {
        studentFields.style.display = 'none';
        professorFields.style.display = 'block';
        // Make professor fields required
        document.getElementById('career').required = false;
        document.getElementById('semester').required = false;
        document.getElementById('job_title').required = true;
        document.getElementById('is_permanent').required = true;
      } else {
        studentFields.style.display = 'none';
        professorFields.style.display = 'none';
        document.getElementById('career').required = false;
        document.getElementById('semester').required = false;
        document.getElementById('job_title').required = false;
        document.getElementById('is_permanent').required = false;
      }
    });

    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(registerForm);
      const data = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
        role: formData.get('role'),
        user_type: formData.get('user_type'),
        display_name: formData.get('display_name'),
        career: formData.get('career') || null,
        semester: formData.get('semester') ? parseInt(formData.get('semester')) : null,
        academic_program: formData.get('academic_program') || null,
        job_title: formData.get('job_title') || null,
        is_permanent: formData.get('is_permanent') === 'true' ? true : formData.get('is_permanent') === 'false' ? false : null
      };

      // Remove null values
      Object.keys(data).forEach(key => data[key] === null && delete data[key]);

      try {
        const csrfToken = getCookie('csrftoken');
        console.log('Sending data:', data);

        const response = await fetch('/api/register/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken || '',
          },
          body: JSON.stringify(data),
        });

        console.log('Response status:', response.status);

        if (response.ok) {
          const data = await response.json();
          console.log('Success data:', data);
          // Redirect to the URL provided by the server
          if (data.redirect_url) {
            console.log('Redirecting to:', data.redirect_url);
            window.location.href = data.redirect_url;
          } else {
            // Fallback redirect
            console.log('Fallback redirect');
            window.location.href = 'http://localhost:3000/page';
          }
        } else {
          const errorData = await response.json();
          console.log('Error data:', errorData);
          const errorBanner = document.getElementById('errorBanner');
          let errorMessage = 'Registration failed: ';
          for (const key in errorData) {
              if (Array.isArray(errorData[key])) {
                errorMessage += `${key}: ${errorData[key].join(', ')} `;
              } else {
                errorMessage += `${key}: ${errorData[key]} `;
              }
          }
          errorBanner.textContent = errorMessage;
          errorBanner.style.display = 'block';
        }
      } catch (error) {
        console.error('Fetch error:', error);
        const errorBanner = document.getElementById('errorBanner');
        errorBanner.textContent = 'Network error: ' + error.message;
        errorBanner.style.display = 'block';
      }
    });

    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
  </script>
</body>
</html>
